name: Feature request
description: Suggest a change to the image or the build
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried already
      description: e.g. build args, mounting your own config
