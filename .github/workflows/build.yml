name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      steampipe_version:
        description: Steampipe release tag (blank = Dockerfile default)
        required: false
      tailpipe_version:
        description: Tailpipe release tag (blank = Dockerfile default)
        required: false
      powerpipe_version:
        description: Powerpipe release tag (blank = Dockerfile default)
        required: false
  schedule:
    # weekly rebuild to pick up base image / CVE patches
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.variant.name }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # PRs build all three clouds but amd64 only - arch-specific breakage is
    # rare and caught on main, whereas a cloud-specific one is not.
    if: github.event_name != 'pull_request' || matrix.platform == 'linux/amd64'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: aws
            clouds: aws
            suffix: ""
          - name: azure
            clouds: azure
            suffix: "-azure"
          - name: gcp
            clouds: gcp
            suffix: "-gcp"
        platform:
          - linux/amd64
          - linux/arm64
        # matching entries just add `runner` to the existing combinations
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        id: prep
        run: |
          echo "pair=${platform//\//-}-${variant}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}
          variant: ${{ matrix.variant.name }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLOUDS=${{ matrix.variant.clouds }}
            ${{ inputs.steampipe_version && format('STEAMPIPE_VERSION={0}', inputs.steampipe_version) || '' }}
            ${{ inputs.tailpipe_version && format('TAILPIPE_VERSION={0}', inputs.tailpipe_version) || '' }}
            ${{ inputs.powerpipe_version && format('POWERPIPE_VERSION={0}', inputs.powerpipe_version) || '' }}
          cache-from: type=gha,scope=${{ steps.prep.outputs.pair }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', steps.prep.outputs.pair) || '' }}
          # PRs build and smoke-test only; nothing is pushed.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'pipesutils:pr' || '' }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || '' }}

      - name: Smoke test (pull request)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm pipesutils:pr bash -lc '
            set -e
            steampipe --version
            tailpipe --version
            powerpipe --version
            steampipe plugin list
            tailpipe plugin list
            steampipe query "select 1 as ok" --output json
            # every selected cloud must have brought its vendor CLI with it
            for cloud in $PIPES_CLOUDS; do
              case "$cloud" in
                aws)   aws --version ;;
                azure) az version --output tsv ;;
                gcp)   gcloud --version | head -1 ;;
              esac
              steampipe plugin list | grep -q "/$cloud@"
            done
          '

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
        env:
          digest: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ steps.prep.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest list (${{ matrix.variant.name }})
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: aws
            suffix: ""
          - name: azure
            suffix: "-azure"
          - name: gcp
            suffix: "-gcp"
    steps:
      - name: Prepare
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*-${{ matrix.variant.name }}
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          # `latest` is the AWS image; every cloud also gets an explicit
          # latest-<cloud> so nobody has to remember which one is the default
          tags: |
            type=raw,value=latest${{ matrix.variant.suffix }},enable={{is_default_branch}}
            type=raw,value=latest-${{ matrix.variant.name }},enable={{is_default_branch}}
            type=ref,event=branch,suffix=${{ matrix.variant.suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.variant.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.variant.suffix }}
            type=sha,format=long,suffix=${{ matrix.variant.suffix }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # index-level annotations are what GHCR reads for the package page
          while IFS= read -r annotation; do
            args+=(--annotation "index:$annotation")
          done < <(jq -r '.[]' <<< "${DOCKER_METADATA_OUTPUT_ANNOTATIONS:-[]}")
          docker buildx imagetools create "${args[@]}" \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.version }}"

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the manifest list (keyless)
        run: |
          digest="$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.version }}" --format '{{ .Manifest.Digest }}')"
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${digest}"

  scan:
    name: trivy scan (${{ matrix.variant.name }})
    needs: [merge]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: aws
            suffix: ""
          - name: azure
            suffix: "-azure"
          - name: gcp
            suffix: "-gcp"
    steps:
      - name: Prepare
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}${{ matrix.variant.suffix }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.variant.name }}
